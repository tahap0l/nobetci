# What each of Nöbetçi's windows may ask Rust to do (C-13).
#
# This folder exists, so Tauri checks every app command against the windows'
# capabilities (capabilities/*.json): a window can call only what its
# capability grants, and a command no window is granted cannot be called from
# any page at all. Requests are answered only from the island; the desktop
# mascot only shows.
#
# Grant by what each window's code actually calls (src/core/bridge.ts and the
# island under src/island, src/ui; src/settings/api.ts and src/settings; and
# src/buddy/main.ts). A new command goes into the list of the window that
# calls it; lib.rs's tests check that every registered command is reachable
# and that the approval commands stay with the island.
#
# quit_app is granted to no window: no page calls it (the tray quits).

[[permission]]
identifier = "island-commands"
description = "The island: requests and their answers, the dashboard, its widgets and the assistant."
commands.allow = [
  "boot",
  "save_settings",
  "set_dnd",
  "quiet_state",
  "notify",
  "log_line",
  "set_collapsed",
  "set_island_rect",
  "reposition",
  "open_folder",
  "focus_session",
  "open_settings_window",
  "approval_ack",
  "approval_shown",
  "approval_pending",
  "approval_decision",
  "approval_respond",
  "approval_allow_low",
  "approval_decline",
  "island_keyboard",
  "island_media",
  "island_media_control",
  "island_stats",
  "island_weather",
  "assistant_open",
  "assistant_ask",
  "assistant_apps",
  "assistant_dictate",
  "set_assistant_target",
  "agenda_list",
  "agenda_put",
  "agenda_delete",
]

