<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nöbetçi</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;

        -webkit-user-select: none;

        touch-action: none;

        cursor: grabbing;
      }

    <canvas id="mascot"></canvas>
