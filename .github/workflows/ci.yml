name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token; nothing in this workflow writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust (stable, with clippy and rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install npm dependencies
        run: npm ci

      - name: Check for invisible characters
        run: npm run check:invisible

      - name: Typecheck the front end
        run: npx tsc --noEmit

      - name: Check Rust formatting
        run: cargo fmt --all --check

      # The app's build script bundles target/release/nobetci-hook.exe as a
      # resource, so the relay has to exist before clippy and the tests compile it.
      - name: Build the relay
        run: cargo build --release --locked -p nobetci-hook

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build the installer
        run: npm run pack

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nobetci-installer-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Both architectures: the app ships as one universal build.
      - name: Set up Rust (stable, with clippy, for Apple silicon and Intel)
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version
          cargo --version

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install npm dependencies
        run: npm ci

      # The app's build script bundles target/release/nobetci-hook as a
      # resource, so the relay has to exist before clippy and the tests compile it.
      - name: Build the relay
        run: cargo build --release --locked -p nobetci-hook

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build the app (universal)
        run: npm run pack:mac

      - name: Upload the disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nobetci-macos-${{ github.sha }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14
