# Builds the Windows installer, runs it on a GitHub Windows machine and takes a
# screenshot of each page (and opens the macOS disk image on a Mac runner), so
# the installer's look can be checked without a Windows PC. Runs on pull
# requests that touch the installer, or by hand; the pictures come back as the
# "installer-preview" and "installer-preview-mac" artifacts.

name: Installer preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src-tauri/nsis/**
      - src-tauri/dmg/**
      - src-tauri/tauri.macos.conf.json
      - src-tauri/tauri.windows.conf.json
      - src/baykus/installer-art.ts
      - scripts/installer-art.mjs
      - scripts/dmg-background.mjs
      - .github/workflows/installer-preview.yml

# The build jobs run npm and cargo code, so their token can only read. The
# small job at the end, which runs nothing from the repository, may write.
permissions:
  contents: read

jobs:
  preview:
    name: Installer screenshots (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build the installer
        run: npm run pack

      - name: Run it and take screenshots
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots\$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          $setup = Get-ChildItem release -Filter *-setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -PassThru
          $shell = New-Object -ComObject WScript.Shell
          Start-Sleep 8
          Shot "1-welcome-a"
          Start-Sleep -Milliseconds 700
          Shot "1-welcome-b"
          for ($i = 2; $i -le 6; $i++) {
            $null = $shell.AppActivate($p.Id)
            Start-Sleep -Milliseconds 400
            [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
            Start-Sleep 6
            Shot "$i-page"
          }
          Start-Sleep -Milliseconds 900
          Shot "7-last-again"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process nobi -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Upload the screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-preview
          path: shots/*.png
          retention-days: 7

  preview-mac:
    name: Disk image screenshot (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install the Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install npm dependencies
        run: npm ci

      - name: Build the disk image
        run: npm run pack:mac
        env:
          # Tauri skips the Finder styling (background, icon places) on CI unless told.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Open it and take a screenshot
        run: |
          set -euo pipefail
          mkdir -p shots
          dmg=$(find release -maxdepth 1 -name '*.dmg' | head -1)
          hdiutil attach "$dmg" -nobrowse -noautoopen | tee attach.txt
          vol=$(grep -o '/Volumes/.*' attach.txt | head -1)
          open "$vol"
          sleep 6
          screencapture -x shots/mac-dmg.png
          hdiutil detach "$vol" -force || true

      - name: Upload the screenshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-preview-mac
          path: shots/*.png
          retention-days: 7

  # Also on a draft release named "installer-preview" (never published), whose
  # files can be fetched where Actions artifacts cannot. The only job with a
  # token that can write, and it runs nothing from the repository.
  draft-release:
    name: Put the screenshots on the draft release
    needs: [preview, preview-mac]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Take the Windows screenshots
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-preview
          path: shots/windows

      - name: Take the macOS screenshot
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-preview-mac
          path: shots/mac

      - name: Replace them on the draft release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$REPO/releases" --jq '.[] | select(.draft and .name == "installer-preview") | .id' | head -1)
          if [[ -z "$id" ]]; then
            id=$(gh api -X POST "repos/$REPO/releases" -f tag_name=installer-preview -f name=installer-preview -F draft=true \
              -f body="Installer screenshots from the Installer preview workflow. Never published." --jq .id)
          fi
          # replace <jq test for the old assets to delete> <new pictures…>
          replace() {
            local test=$1
            shift
            [[ $# -gt 0 ]] || return 0
            for asset in $(gh api "repos/$REPO/releases/$id/assets" --jq ".[] | select($test) | .id"); do
              gh api -X DELETE "repos/$REPO/releases/assets/$asset" > /dev/null
            done
            for file in "$@"; do
              gh api -X POST "https://uploads.github.com/repos/$REPO/releases/$id/assets?name=$(basename "$file")" \
                -H "Content-Type: image/png" --input "$file" > /dev/null
              echo "uploaded $(basename "$file")"
            done
          }
          shopt -s nullglob
          windows=(shots/windows/*.png)
          mac=(shots/mac/*.png)
          replace '.name | startswith("mac-") | not' "${windows[@]}"
          replace '.name | startswith("mac-")' "${mac[@]}"
