name: Publish website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/media/**
      # The mascot engine, and the island itself: the live demo is built from src/.
      - src/**
      - index.html
      - src-tauri/icons/128x128.png
      - vite.config.ts
      - package*.json
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --no-install vite build
        env:
          CF_PAGES: "1"
          NOBETCI_WEBSITE_BASE: /${{ github.event.repository.name }}/
      # GitHub Pages sends no custom headers and would publish _headers as a
      # plain file. The pages carry their policy in <meta> tags instead (see
      # website/public/_headers for what that covers and what it cannot).
      - run: rm -f dist/_headers
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

