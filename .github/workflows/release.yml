name: Release

# Started by hand from main: Actions → Release → Run workflow, with the tag to
# create. That is the path CODE_SIGNING_POLICY.md describes, and SignPath signs
# for main only. A run from any other branch builds and tests everything but
# publishes nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching the version in main (for example v2.1.0)"
        required: true
        type: string
      replace:
        description: "The tag or the release already exists: move the tag to this commit and replace the release's files and notes (or create the release if only the tag is there)"
        required: false
        type: boolean
        default: false

# The build jobs run third-party code (npm and cargo dependencies) with a
# read-only token and no signing secrets. Signing happens in jobs of their own
# that run nothing from the repository. Only the small publish job may write —
# and only to create the release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      app-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against the version numbers
        id: version
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$env:TAG' isn't v<semver> (for example v0.2.0 or v0.3.0-beta.1)."
          }
          $version = $env:TAG.Substring(1)
          $found = [ordered]@{
            'package.json'              = (Get-Content package.json -Raw | ConvertFrom-Json).version
            'src-tauri/tauri.conf.json' = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            'Cargo.toml'                = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
                                            Select-Object -First 1).Matches[0].Groups[1].Value
          }
          $wrong = $found.GetEnumerator() | Where-Object { $_.Value -ne $version }
          if ($wrong) {
            $list = ($wrong | ForEach-Object { "$($_.Key) has $($_.Value)" }) -join '; '
            throw "Tag $env:TAG doesn't match: $list."
          }
          if ($env:REF -ne 'refs/heads/main') {
            "::notice::Run from $env:REF, not main: everything is built and tested, nothing is published."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Releasing $version"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust (stable, with clippy and rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A release run's cache is never needed again.
          save-if: false

      - name: Install npm dependencies
        run: npm ci

      - name: Check for invisible characters
        run: npm run check:invisible

      - name: Typecheck the front end
        run: npx tsc --noEmit

      - name: Check Rust formatting
        run: cargo fmt --all --check

      # The app's build script bundles target/release/nobetci-hook.exe as a
      # resource, so the relay has to exist before clippy and the tests compile it.
      - name: Build the relay
        run: cargo build --release --locked -p nobetci-hook

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # Only the programs here. The installer is made in the next job, from
      # the programs as they come back from code signing.
      - name: Build the app and the relay
        run: npx tauri build --no-bundle

      - name: Upload the programs for signing
        id: upload-app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app
          path: |
            target/release/nobetci.exe
            target/release/nobetci-hook.exe
          if-no-files-found: error
          retention-days: 7

      - name: Write the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          node .github/scripts/release-notes.mjs $env:VERSION --out release/RELEASE_NOTES.md

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  # Windows code signing goes through SignPath (see CODE_SIGNING_POLICY.md).
  # It is on once the repository has the SIGNPATH_ORGANIZATION_ID variable and
  # the SIGNPATH_API_TOKEN secret; until then both signing steps pass the files
  # through unsigned, as before. Every signing request waits for a person to
  # approve it on SignPath, so a release asks twice: the programs, then the
  # installer that carries them.
  bundle-windows:
    name: Sign the programs and build the installer (Windows)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      VERSION: ${{ needs.build.outputs.version }}
    outputs:
      setup-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
    steps:
      # First, before anything from the repository or npm runs on this machine.
      - name: Sign the programs (SignPath)
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'nobetci' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          parameters: |
            version: "${{ needs.build.outputs.version }}"
          github-artifact-id: ${{ needs.build.outputs.app-artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app

      - name: Take the unsigned programs
        if: env.SIGNPATH_ORGANIZATION_ID == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-app
          path: signed-app

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src

      - name: Put the programs where Tauri expects them
        run: |
          New-Item -ItemType Directory -Force src/target/release | Out-Null
          foreach ($name in 'nobetci.exe', 'nobetci-hook.exe') {
            $file = Get-ChildItem signed-app -Recurse -Filter $name | Select-Object -First 1
            if (-not $file) { throw "$name is missing from the signed programs." }
            Copy-Item $file.FullName "src/target/release/$name"
            # SignPath refuses a file whose product name or version is off; fail here first.
            $vi = (Get-Item "src/target/release/$name").VersionInfo
            "::notice::$name ProductName=$($vi.ProductName) ProductVersion=$($vi.ProductVersion)"
            if ($vi.ProductName -ne 'Nobetci' -or $vi.ProductVersion -ne $env:VERSION) {
              throw "$name says $($vi.ProductName) $($vi.ProductVersion), not Nobetci $env:VERSION."
            }
            $sig = Get-AuthenticodeSignature "src/target/release/$name"
            "{0}: {1} {2}" -f $name, $sig.Status, $sig.SignerCertificate.Subject
            if ($env:SIGNPATH_ORGANIZATION_ID -and $sig.Status -ne 'Valid') {
              throw "$name came back from SignPath without a valid signature."
            }
          }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install npm dependencies
        working-directory: src
        run: npm ci

      # Bundles what is already in target/release; nothing is compiled again.
      # The installer must carry exactly the bytes that came back from signing:
      # without --no-binary-patching, `tauri bundle` would write the bundle type
      # into nobetci.exe in place and break its signature (only Tauri's updater
      # reads that mark, and Nöbetçi has none). The hashes prove nothing else
      # touched the programs either.
      - name: Build the installer
        working-directory: src
        run: |
          $programs = 'target/release/nobetci.exe', 'target/release/nobetci-hook.exe'
          $before = $programs | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash }
          npx tauri bundle --bundles nsis --no-binary-patching
          if ($LASTEXITCODE -ne 0) { throw "tauri bundle failed ($LASTEXITCODE)." }
          $after = $programs | ForEach-Object { (Get-FileHash $_ -Algorithm SHA256).Hash }
          if (Compare-Object $before $after) {
            throw "tauri bundle changed the programs after signing; the installer would not carry the signed files."
          }
          foreach ($program in $programs) {
            $sig = Get-AuthenticodeSignature $program
            "{0} in the installer: {1}" -f $program, $sig.Status
            if ($env:SIGNPATH_ORGANIZATION_ID -and $sig.Status -ne 'Valid') {
              throw "$program is no longer validly signed ($($sig.Status))."
            }
          }
          node scripts/pack.mjs
          if ($LASTEXITCODE -ne 0) { throw "pack.mjs failed ($LASTEXITCODE)." }

      - name: Upload the installer for signing
        id: upload-setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-setup
          path: src/release/Nobetci-${{ needs.build.outputs.version }}-setup.exe
          if-no-files-found: error
          retention-days: 7

  # A job of its own, on a fresh machine: nothing from npm has run where the
  # API token is used.
  sign-windows:
    name: Sign the installer (Windows)
    needs: [build, bundle-windows]
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    env:
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Sign the installer (SignPath)
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'nobetci' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          parameters: |
            version: "${{ needs.build.outputs.version }}"
          github-artifact-id: ${{ needs.bundle-windows.outputs.setup-artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release

      - name: Take the unsigned installer
        if: env.SIGNPATH_ORGANIZATION_ID == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-setup
          path: release

      - name: Check the signature and write the checksum
        run: |
          $name = "Nobetci-$env:VERSION-setup.exe"
          $path = Join-Path release $name
          if (-not (Test-Path $path)) { throw "$path is missing." }
          $vi = (Get-Item $path).VersionInfo
          "::notice::$name ProductName=$($vi.ProductName) ProductVersion=$($vi.ProductVersion)"
          if ($vi.ProductName -ne 'Nobetci' -or $vi.ProductVersion -ne $env:VERSION) {
            throw "$name says $($vi.ProductName) $($vi.ProductVersion), not Nobetci $env:VERSION."
          }
          $sig = Get-AuthenticodeSignature $path
          "{0}: {1} {2}" -f $name, $sig.Status, $sig.SignerCertificate.Subject
          if ($env:SIGNPATH_ORGANIZATION_ID -and $sig.Status -ne 'Valid') {
            throw "The installer came back from SignPath without a valid signature."
          }
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          # sha256sum format with LF endings, so `sha256sum -c` works on any OS.
          # The publish job joins every platform's line into SHA256SUMS.txt.
          [IO.File]::WriteAllText((Join-Path $PWD "release/$name.sha256"), "$hash  $name`n")
          Get-Content "release/$name.sha256"

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            release/Nobetci-${{ needs.build.outputs.version }}-setup.exe
            release/Nobetci-${{ needs.build.outputs.version }}-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build, test and package (macOS)
    # The tag/version check lives in the Windows job; publishing waits for both.
    # No Apple secrets here: this job runs npm and cargo code. The app comes out
    # ad-hoc signed, and sign-macos signs it with the Developer ID.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Both architectures: the app ships as one universal build.
      - name: Set up Rust (stable, for Apple silicon and Intel)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version
          cargo --version

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A release run's cache is never needed again.
          save-if: false

      - name: Install npm dependencies
        run: npm ci

      - name: Build the relay
        run: cargo build --release --locked -p nobetci-hook

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build the disk image (universal)
        run: npm run pack:mac
        env:
          # Tauri skips the Finder styling (background, icon places) on CI unless told.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Upload the disk image for signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 7

  # Apple signing and notarization, the way sign-windows works: a fresh machine
  # where nothing from the repository, npm or cargo runs while the APPLE_*
  # secrets are in reach; only Apple's own tools touch the files. Without the
  # secrets the disk image passes through ad-hoc signed, as before.
  #
  # With them: the relay and then the app inside the disk image are signed with
  # the Developer ID (hardened runtime, keeping the entitlements Tauri signed in
  # from src-tauri/entitlements.plist), the app is notarized and stapled, and
  # the image is put back together with its Finder look and signed, as Tauri
  # does. Never run here: check the first signed release's log and the result
  # of `spctl -a -vv Nobetci.app` on a Mac.
  sign-macos:
    name: Sign and notarize the disk image (macOS)
    needs: [build, build-macos]
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.build.outputs.version }}
    outputs:
      notarized: ${{ steps.sign.outputs.notarized }}
    steps:
      - name: Take the disk image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-dmg
          path: in

      - name: Sign and notarize (Developer ID), if there are Apple secrets
        id: sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          name="Nobetci-${VERSION}-macos-universal.dmg"
          test -f "in/$name" || { echo "in/$name is missing; did npm run pack:mac name it differently?"; exit 1; }
          mkdir -p release
          echo "notarized=false" >> "$GITHUB_OUTPUT"
          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "No Apple signing secrets: the disk image stays ad-hoc signed."
            cp "in/$name" "release/$name"
            exit 0
          fi

          # The certificate lives in a keychain of its own for this job only.
          keychain="$RUNNER_TEMP/nobetci-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          trap 'security delete-keychain "$keychain" 2>/dev/null || true' EXIT
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          keychains=()
          while IFS= read -r line; do
            line=${line#"${line%%[![:space:]]*}"}; line=${line#\"}; line=${line%\"}
            keychains+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${keychains[@]}"

          # A writable copy of the image, with room for the signatures, so the
          # window keeps the background and icon places Tauri gave it.
          hdiutil convert "in/$name" -format UDRW -o "$RUNNER_TEMP/rw.dmg"
          hdiutil resize -size "$(( $(stat -f%z "$RUNNER_TEMP/rw.dmg") / 1048576 + 64 ))m" "$RUNNER_TEMP/rw.dmg"
          mount=$(hdiutil attach "$RUNNER_TEMP/rw.dmg" -nobrowse -noautoopen | grep -o '/Volumes/.*' | head -1)
          app="$mount/Nobetci.app"
          test -d "$app" || { echo "Nobetci.app is not in the disk image."; exit 1; }

          # Inside out: the relay (a resource, which Tauri does not sign), then the app.
          sign() {
            codesign --force --timestamp --options runtime --preserve-metadata=entitlements \
              --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$@"
          }
          sign "$app/Contents/Resources/nobetci-hook"
          sign "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --entitlements - "$app"

          if [[ -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Nobetci.zip"
            xcrun notarytool submit "$RUNNER_TEMP/Nobetci.zip" \
              --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$app"
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::APPLE_ID, APPLE_PASSWORD or APPLE_TEAM_ID is missing: the app is signed but not notarized."
          fi

          hdiutil detach "$mount"
          hdiutil convert "$RUNNER_TEMP/rw.dmg" -format UDZO -imagekey zlib-level=9 -o "release/$name"
          codesign --force --timestamp --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "release/$name"

      - name: Write the checksum
        run: |
          set -euo pipefail
          name="Nobetci-${VERSION}-macos-universal.dmg"
          (cd release && shasum -a 256 "$name" > "$name.sha256" && cat "$name.sha256")

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build, test and package (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The GStreamer plugins and patchelf are for the AppImage, which carries
      # every plugin installed here (bundleMediaFramework): the island's sounds
      # are WebAudio, which WebKitGTK plays through appsrc and autoaudiosink.
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxi-dev libxdo-dev libdbus-1-dev libssl-dev file patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gstreamer1.0-alsa

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false

      - name: Install npm dependencies
        run: npm ci

      - name: Build the relay
        run: cargo build --release --locked -p nobetci-hook

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build the .deb and the AppImage
        run: npm run pack:linux

      # Without these the AppImage plays none of the island's sounds.
      - name: Check the AppImage carries the audio plugins
        run: |
          set -euo pipefail
          appimage=$(ls "$GITHUB_WORKSPACE"/release/Nobetci-*-linux-amd64.AppImage)
          cd "$RUNNER_TEMP"
          "$appimage" --appimage-extract > /dev/null
          for plugin in libgstapp.so libgstautodetect.so libgstaudioconvert.so libgstaudioresample.so libgstpulseaudio.so libgstalsa.so; do
            test -f "squashfs-root/usr/lib/gstreamer-1.0/$plugin" || { echo "::error::The AppImage has no $plugin, so its sounds would not play."; exit 1; }
          done
          echo "The AppImage carries the audio plugins."

      - name: Write the checksums
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd release
          for name in "Nobetci-${TAG#v}-linux-amd64.deb" "Nobetci-${TAG#v}-linux-amd64.AppImage"; do
            test -f "$name" || { echo "release/$name is missing; did npm run pack:linux name it differently?"; exit 1; }
            sha256sum "$name" > "$name.sha256"
            cat "$name.sha256"
          done

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            release/*.deb
            release/*.AppImage
            release/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish the GitHub release
    needs: [build, sign-windows, sign-macos, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: out

      # Every file also goes out under a name without the version, so a page can
      # link to the newest one directly (releases/latest/download/<name>).
      - name: Add unversioned names, join and verify the checksums
        working-directory: out
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cat ./*.sha256 > SHA256SUMS.txt
          rm ./*.sha256
          for name in setup.exe macos-universal.dmg linux-amd64.deb linux-amd64.AppImage; do
            cp "Nobetci-${VERSION}-${name}" "Nobetci-${name}"
            hash=$(grep -F "  Nobetci-${VERSION}-${name}" SHA256SUMS.txt | cut -d' ' -f1)
            echo "${hash}  Nobetci-${name}" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      # Only this run knows what was signed, so the notes say it here.
      - name: Say in the notes what is signed
        working-directory: out
        env:
          WINDOWS_SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
          MAC_NOTARIZED: ${{ needs.sign-macos.outputs.notarized }}
        run: |
          set -euo pipefail
          {
            echo
            if [[ "$WINDOWS_SIGNED" == "true" ]]; then
              echo "**Signing.** The Windows installer and both programs are code-signed." \
                "Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org)."
            else
              echo "**Signing.** The Windows files of this release are not code-signed, so SmartScreen warns the first time you open the installer."
            fi
            if [[ "$MAC_NOTARIZED" == "true" ]]; then
              echo "The macOS app is signed with a Developer ID and notarized by Apple."
            else
              echo "The macOS app is not notarized, so macOS asks before you open it the first time."
            fi
            if [[ "$WINDOWS_SIGNED" != "true" || "$MAC_NOTARIZED" != "true" ]]; then
              echo "The installation guide shows how to get past the warning."
            fi
          } >> RELEASE_NOTES.md
          tail -n 6 RELEASE_NOTES.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          REPLACE: ${{ inputs.replace || false }}
        run: |
          set -euo pipefail
          files=(
            "out/Nobetci-${VERSION}-setup.exe"
            "out/Nobetci-${VERSION}-macos-universal.dmg"
            "out/Nobetci-${VERSION}-linux-amd64.deb"
            "out/Nobetci-${VERSION}-linux-amd64.AppImage"
            out/Nobetci-setup.exe
            out/Nobetci-macos-universal.dmg
            out/Nobetci-linux-amd64.deb
            out/Nobetci-linux-amd64.AppImage
            out/SHA256SUMS.txt
          )

          # Where the tag points now, if it exists (an annotated tag is followed
          # to its commit). GitHub ignores --target for a tag that exists, so a
          # tag on another commit would put these files under that commit.
          tag_sha=""
          if found=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$TAG" --jq .sha 2>&1); then
            tag_sha=$found
          elif ! grep -qE 'HTTP (404|422)' <<< "$found"; then
            echo "::error::Could not look up the tag $TAG: $found"
            exit 1
          fi
          release_exists=false
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then release_exists=true; fi

          if [[ "$REPLACE" == "true" ]]; then
            # Asked for by hand only: rebuild a version without a new number.
            # The tag moves to this commit; the files and notes are swapped.
            if [[ -n "$tag_sha" && "$tag_sha" != "$RELEASE_SHA" ]]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$RELEASE_SHA" -F force=true > /dev/null
            fi
            if [[ "$release_exists" == "true" ]]; then
              gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
              gh release edit "$TAG" --notes-file out/RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
              exit 0
            fi
            # Only the tag was there (an earlier run stopped after making it).
          elif [[ -n "$tag_sha" && "$tag_sha" != "$RELEASE_SHA" ]]; then
            echo "::error::The tag $TAG already points at $tag_sha, not at $RELEASE_SHA, which this run built. Run again with 'replace' to move it here, or release a new version."
            exit 1
          elif [[ "$release_exists" == "true" ]]; then
            echo "::error::The release $TAG already exists. Run again with 'replace' to rebuild it from this commit."
            exit 1
          fi

          flags=(--target "$RELEASE_SHA")
          # v0.3.0-beta.1 and the like are pre-releases.
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Nöbetçi $TAG" \
            --notes-file out/RELEASE_NOTES.md \
            "${flags[@]}"
