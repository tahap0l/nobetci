name: Release

on:
  push:
    tags: ["v*"]

# The build job runs third-party code (npm and cargo dependencies) with a
# read-only token. Only the small publish job, which runs nothing from the
# repository, may write — and only to create the release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build, test and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against the version numbers
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$env:TAG' isn't v<semver> (for example v0.2.0 or v0.3.0-beta.1)."
          }
          $version = $env:TAG.Substring(1)
          $found = [ordered]@{
            'package.json'              = (Get-Content package.json -Raw | ConvertFrom-Json).version
            'src-tauri/tauri.conf.json' = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            'Cargo.toml'                = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
                                            Select-Object -First 1).Matches[0].Groups[1].Value
          }
          $wrong = $found.GetEnumerator() | Where-Object { $_.Value -ne $version }
          if ($wrong) {
            $list = ($wrong | ForEach-Object { "$($_.Key) has $($_.Value)" }) -join '; '
            throw "Tag $env:TAG doesn't match: $list."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Releasing $version"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust (stable, with clippy and rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A cache saved under a tag is never restored by anything else.
          save-if: false

      - name: Install npm dependencies
        run: npm ci

      - name: Check for invisible characters
        run: npm run check:invisible

      - name: Typecheck the front end
        run: npx tsc --noEmit

      - name: Check Rust formatting
        run: cargo fmt --all --check

      # The app's build script bundles target/release/nobetci-hook.exe as a
      # resource, so the relay has to exist before clippy and the tests compile it.
      - name: Build the relay
        run: cargo build --release --locked -p nobetci-hook

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build the installer
        run: npm run pack

      - name: Write the checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "Nobetci-$env:VERSION-setup.exe"
          $path = Join-Path release $name
          if (-not (Test-Path $path)) { throw "$path is missing; did npm run pack name it differently?" }
          $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          # sha256sum format with LF endings, so `sha256sum -c` works on any OS.
          # The publish job joins every platform's line into SHA256SUMS.txt.
          [IO.File]::WriteAllText((Join-Path $PWD "release/$name.sha256"), "$hash  $name`n")
          Get-Content "release/$name.sha256"

      - name: Write the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node .github/scripts/release-notes.mjs $env:VERSION --out release/RELEASE_NOTES.md

      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: |
            release/Nobetci-${{ steps.version.outputs.version }}-setup.exe
            release/Nobetci-${{ steps.version.outputs.version }}-setup.exe.sha256
            release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build, test and package (macOS)
    # The tag/version check lives in the Windows job; publishing waits for both.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Both architectures: the app ships as one universal build.
      - name: Set up Rust (stable, for Apple silicon and Intel)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version
          cargo --version

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A cache saved under a tag is never restored by anything else.
          save-if: false

      - name: Install npm dependencies
        run: npm ci

      - name: Build the relay
        run: cargo build --release --locked -p nobetci-hook

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build the disk image (universal)
        run: npm run pack:mac

      - name: Write the checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="Nobetci-${TAG#v}-macos-universal.dmg"
          test -f "release/$name" || { echo "release/$name is missing; did npm run pack:mac name it differently?"; exit 1; }
          (cd release && shasum -a 256 "$name" > "$name.sha256" && cat "$name.sha256")

      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub release
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: out

      - name: Join and verify the checksums
        working-directory: out
        run: |
          set -euo pipefail
          cat *.sha256 > SHA256SUMS.txt
          rm *.sha256
          cat SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          flags=()
          # v0.3.0-beta.1 and the like are pre-releases.
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" \
            "out/Nobetci-${VERSION}-setup.exe" \
            "out/Nobetci-${VERSION}-macos-universal.dmg" \
            out/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Nöbetçi $TAG" \
            --notes-file out/RELEASE_NOTES.md \
            "${flags[@]}"
